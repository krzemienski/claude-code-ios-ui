name: Continuous Testing Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests every day at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - smoke
          - regression
          - performance
      environment:
        description: 'Test environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - staging
          - production

env:
  XCODE_VERSION: 15.2
  IOS_VERSION: 17.2
  SIMULATOR_NAME: "iPhone 15 Pro"
  NODE_VERSION: 20.x
  BACKEND_URL: ws://localhost:3004/ws

jobs:
  setup:
    name: Setup Test Environment
    runs-on: macos-14
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
      test-id: ${{ steps.test-id.outputs.id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate test ID
        id: test-id
        run: echo "id=test-$(date +%Y%m%d-%H%M%S)-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Generate cache key
        id: cache-key
        run: |
          echo "key=ios-${{ hashFiles('**/Package.resolved', '**/Podfile.lock', '**/Tuist/Config.swift') }}" >> $GITHUB_OUTPUT

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/.swiftpm
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            ios-

      - name: Install Tuist
        run: |
          curl -Ls https://install.tuist.io | bash
          tuist version

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Upload environment info
        uses: actions/upload-artifact@v4
        with:
          name: environment-${{ steps.test-id.outputs.id }}
          path: |
            .github/workflows/continuous-testing.yml
            ClaudeCodeUI-iOS/Project.swift
          retention-days: 7

  build:
    name: Build Application
    needs: setup
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/.swiftpm
          key: ${{ needs.setup.outputs.cache-key }}

      - name: Generate project
        working-directory: ClaudeCodeUI-iOS
        run: tuist generate

      - name: Build for testing
        working-directory: ClaudeCodeUI-iOS
        run: |
          xcodebuild build-for-testing \
            -workspace ClaudeCodeUI.xcworkspace \
            -scheme ClaudeCodeUI \
            -destination "platform=iOS Simulator,name=${{ env.SIMULATOR_NAME }},OS=${{ env.IOS_VERSION }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            | xcpretty --json-report build-report.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ needs.setup.outputs.test-id }}
          path: |
            ClaudeCodeUI-iOS/DerivedData/Build/Products/Debug-iphonesimulator/*.app
            ClaudeCodeUI-iOS/DerivedData/Build/Products/Debug-iphonesimulator/*.xctest
            ClaudeCodeUI-iOS/build-report.json
          retention-days: 7

  unit-tests:
    name: Unit Tests
    needs: [setup, build]
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ needs.setup.outputs.test-id }}
          path: ClaudeCodeUI-iOS/DerivedData/Build/Products

      - name: Run unit tests
        working-directory: ClaudeCodeUI-iOS
        run: |
          xcodebuild test-without-building \
            -workspace ClaudeCodeUI.xcworkspace \
            -scheme ClaudeCodeUI \
            -destination "platform=iOS Simulator,name=${{ env.SIMULATOR_NAME }},OS=${{ env.IOS_VERSION }}" \
            -only-testing:ClaudeCodeUITests \
            -resultBundlePath TestResults/UnitTests.xcresult \
            | xcpretty --json-report unit-test-report.json

      - name: Generate coverage report
        if: always()
        working-directory: ClaudeCodeUI-iOS
        run: |
          xcrun xccov view --report --json TestResults/UnitTests.xcresult > coverage.json
          python3 ../Scripts/parse_coverage.py coverage.json > coverage-summary.md

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ needs.setup.outputs.test-id }}
          path: |
            ClaudeCodeUI-iOS/TestResults/UnitTests.xcresult
            ClaudeCodeUI-iOS/unit-test-report.json
            ClaudeCodeUI-iOS/coverage.json
            ClaudeCodeUI-iOS/coverage-summary.md
          retention-days: 30

  integration-tests:
    name: Integration Tests
    needs: [setup, build]
    runs-on: macos-14
    services:
      backend:
        image: node:20-alpine
        options: --health-cmd "curl -f http://localhost:3004/health || exit 1"
        ports:
          - 3004:3004
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup test environment
        uses: ./.github/actions/setup-test-env
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Start backend server
        working-directory: backend
        run: |
          npm ci
          npm start &
          sleep 5
          curl -f http://localhost:3004/health || exit 1

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ needs.setup.outputs.test-id }}
          path: ClaudeCodeUI-iOS/DerivedData/Build/Products

      - name: Run integration tests
        working-directory: ClaudeCodeUI-iOS
        run: |
          xcodebuild test-without-building \
            -workspace ClaudeCodeUI.xcworkspace \
            -scheme ClaudeCodeUI \
            -destination "platform=iOS Simulator,name=${{ env.SIMULATOR_NAME }},OS=${{ env.IOS_VERSION }}" \
            -only-testing:ClaudeCodeUIIntegrationTests \
            -resultBundlePath TestResults/IntegrationTests.xcresult \
            | xcpretty --json-report integration-test-report.json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-${{ needs.setup.outputs.test-id }}
          path: |
            ClaudeCodeUI-iOS/TestResults/IntegrationTests.xcresult
            ClaudeCodeUI-iOS/integration-test-report.json
          retention-days: 30

  ui-tests:
    name: UI Tests
    needs: [setup, build]
    runs-on: macos-14
    strategy:
      matrix:
        device:
          - name: "iPhone 15 Pro"
            os: "17.2"
          - name: "iPhone 14"
            os: "16.4"
          - name: "iPad Pro (12.9-inch)"
            os: "17.2"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup test environment
        uses: ./.github/actions/setup-test-env
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Start backend server
        working-directory: backend
        run: |
          npm ci
          npm start &
          sleep 5

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ needs.setup.outputs.test-id }}
          path: ClaudeCodeUI-iOS/DerivedData/Build/Products

      - name: Boot simulator
        run: |
          xcrun simctl boot "${{ matrix.device.name }}" || true
          xcrun simctl wait "${{ matrix.device.name }}" --state=booted

      - name: Run UI tests
        working-directory: ClaudeCodeUI-iOS
        run: |
          xcodebuild test-without-building \
            -workspace ClaudeCodeUI.xcworkspace \
            -scheme ClaudeCodeUI \
            -destination "platform=iOS Simulator,name=${{ matrix.device.name }},OS=${{ matrix.device.os }}" \
            -only-testing:ClaudeCodeUIUITests \
            -resultBundlePath TestResults/UITests-${{ matrix.device.name }}.xcresult \
            | xcpretty --json-report ui-test-report-${{ matrix.device.name }}.json

      - name: Capture screenshots
        if: failure()
        run: |
          xcrun simctl io "${{ matrix.device.name }}" screenshot failure-screenshot.png
          xcrun simctl diagnose --output diagnose-${{ matrix.device.name }}.zip

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results-${{ matrix.device.name }}-${{ needs.setup.outputs.test-id }}
          path: |
            ClaudeCodeUI-iOS/TestResults/UITests-*.xcresult
            ClaudeCodeUI-iOS/ui-test-report-*.json
            failure-screenshot.png
            diagnose-*.zip
          retention-days: 30

  performance-tests:
    name: Performance Tests
    needs: [setup, build]
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup test environment
        uses: ./.github/actions/setup-test-env
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ needs.setup.outputs.test-id }}
          path: ClaudeCodeUI-iOS/DerivedData/Build/Products

      - name: Run performance tests
        working-directory: ClaudeCodeUI-iOS
        run: |
          xcodebuild test-without-building \
            -workspace ClaudeCodeUI.xcworkspace \
            -scheme ClaudeCodeUI \
            -destination "platform=iOS Simulator,name=${{ env.SIMULATOR_NAME }},OS=${{ env.IOS_VERSION }}" \
            -only-testing:ClaudeCodeUIUITests/PerformanceTests \
            -resultBundlePath TestResults/PerformanceTests.xcresult \
            -enablePerformanceTestsDiagnostics YES \
            | xcpretty --json-report performance-test-report.json

      - name: Extract performance metrics
        working-directory: ClaudeCodeUI-iOS
        run: |
          xcrun xcresulttool get --path TestResults/PerformanceTests.xcresult \
            --format json > performance-metrics.json
          python3 ../Scripts/parse_performance.py performance-metrics.json > performance-summary.md

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-test-results-${{ needs.setup.outputs.test-id }}
          path: |
            ClaudeCodeUI-iOS/TestResults/PerformanceTests.xcresult
            ClaudeCodeUI-iOS/performance-*.json
            ClaudeCodeUI-iOS/performance-summary.md
          retention-days: 30

  report:
    name: Generate Test Report
    needs: [setup, unit-tests, integration-tests, ui-tests, performance-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: '*-test-results-*'
          path: test-results

      - name: Generate consolidated report
        run: |
          python3 Scripts/generate_test_report.py \
            --results-dir test-results \
            --output-file test-report.html \
            --format html

      - name: Generate JSON summary
        run: |
          python3 Scripts/generate_test_summary.py \
            --results-dir test-results \
            --output-file test-summary.json

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('test-summary.json', 'utf8'));
            
            const comment = `## 📊 Test Results
            
            | Test Suite | Passed | Failed | Skipped | Pass Rate |
            |------------|--------|--------|---------|-----------|
            | Unit Tests | ${summary.unit.passed} | ${summary.unit.failed} | ${summary.unit.skipped} | ${summary.unit.passRate}% |
            | Integration Tests | ${summary.integration.passed} | ${summary.integration.failed} | ${summary.integration.skipped} | ${summary.integration.passRate}% |
            | UI Tests | ${summary.ui.passed} | ${summary.ui.failed} | ${summary.ui.skipped} | ${summary.ui.passRate}% |
            | Performance Tests | ${summary.performance.passed} | ${summary.performance.failed} | ${summary.performance.skipped} | ${summary.performance.passRate}% |
            
            **Overall Pass Rate:** ${summary.overall.passRate}%
            **Test Duration:** ${summary.duration}
            
            [View Full Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Upload final report
        uses: actions/upload-artifact@v4
        with:
          name: final-test-report-${{ needs.setup.outputs.test-id }}
          path: |
            test-report.html
            test-summary.json
          retention-days: 90

      - name: Publish test report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          destination_dir: test-reports/${{ needs.setup.outputs.test-id }}
          keep_files: true

  notify:
    name: Send Notifications
    needs: [report]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Determine status
        id: status
        run: |
          if [[ "${{ needs.report.result }}" == "success" ]]; then
            echo "emoji=✅" >> $GITHUB_OUTPUT
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            echo "emoji=❌" >> $GITHUB_OUTPUT
            echo "status=failed" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        if: vars.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "${{ steps.status.outputs.emoji }} Test Suite ${{ steps.status.outputs.status }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ steps.status.outputs.emoji }} Test Suite ${{ steps.status.outputs.status }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n${{ github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n${{ github.sha }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Run:*\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Results>"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}